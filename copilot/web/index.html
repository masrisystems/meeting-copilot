<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Copilot</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  :root {
    --bg: #07090c; --panel: #10141a; --line: #1f2630; --text: #f4f6f8; --dim: #8a94a3;
    --user: #7cc4ff; --part: #ffd166; --ok: #3ddc97; --warn: #ffb020; --err: #ff5d5d;
    --confident: #4fd1ff; --consultative: #3ddc97; --deesc: #ffb020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel); font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .badge { padding: 2px 8px; border-radius: 4px; background: var(--line); color: var(--text); font-weight: 600; }
  .badge.cloud { background: #0f3d57; color: var(--confident); }
  #provider { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 4px; font: 600 12px "Segoe UI", sans-serif; max-width: 190px; }
  .badge.ollama { background: #4a3500; color: var(--warn); }
  .badge.off { background: #3a1212; color: var(--err); }
  .meter { display: flex; align-items: center; gap: 4px; }
  .meter svg { width: 14px; height: 14px; }
  .bar { width: 36px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .15s; }
  .spacer { flex: 1; }
  button.tog { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 4px;
    padding: 3px 8px; font: inherit; cursor: pointer; }
  button.tog.on { border-color: var(--ok); color: var(--ok); }
  button.tog.icon { display: flex; padding: 3px 6px; }
  button.tog.icon svg { width: 14px; height: 14px; }

  #bar { display: flex; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #meeting { flex: 1; border: 1px solid var(--ok); border-radius: 4px; padding: 8px; cursor: pointer;
    background: var(--ok); color: #000; font: 700 15px "Segoe UI", sans-serif; }
  #meeting.live { background: transparent; color: var(--err); border-color: var(--err); }
  #meeting.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--err); margin-right: 8px; vertical-align: 1px; }
  #win { display: none; align-items: center; gap: 6px; }
  #win input { width: 70px; accent-color: var(--confident); }
  #mic { display: flex; align-items: center; gap: 6px; padding: 3px 10px; }
  #mic svg { width: 16px; height: 16px; }
  #mic.muted { border-color: var(--err); color: var(--err); }
  #notice .n { padding: 6px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  #notice .err { color: var(--err); }
  #notice .warn { color: var(--warn); }
  #notice .info { background: #0f2a3a; }
  button.link { background: none; border: 0; padding: 0; color: var(--confident); text-decoration: underline;
    font: inherit; cursor: pointer; }

  #cards { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 55vh; overflow-y: auto; }
  .card { border-left: 4px solid var(--confident); background: var(--panel); border-radius: 6px; padding: 10px 12px;
    transition: opacity .4s; }
  .card { cursor: pointer; }
  .card.old { opacity: .7; }
  .card.pinned { opacity: 1; outline: 1px solid var(--confident); }
  .card.pinned .meta::after { content: "angeheftet"; margin-left: auto; color: var(--confident); }
  body.single .card:not(.old) .sugg { font-size: 27px; }
  #pending { display: none; margin: 8px 12px 0; padding: 6px 10px; border: 1px solid var(--confident);
    border-radius: 4px; background: #0f2a3a; color: var(--text); font: 600 13px "Segoe UI", sans-serif;
    cursor: pointer; text-align: left; }
  .card.old .sugg { font-size: 16px; }
  .card .meta { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
    display: flex; gap: 8px; margin-bottom: 4px; }
  .card .meta b { color: var(--text); }
  .card.answer { border-left-color: #b48cff; }
  .sugg { font-size: 23px; font-weight: 700; line-height: 1.3; margin: 4px 0; }
  .sugg + .sugg { margin-top: 10px; }
  .sugg small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .t-confident small { color: var(--confident); }
  .t-consultative small { color: var(--consultative); }
  .t-de-escalating small { color: var(--deesc); }
  #empty { color: var(--dim); font-size: 14px; padding: 8px 0; }

  #transcript { flex: 1; overflow-y: auto; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .turn { margin: 6px 0; }
  .turn .who { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .turn.User .who { color: var(--user); }
  .turn.Participant .who { color: var(--part); }
  .seg { color: #d6dbe1; }
  .tr { display: block; color: var(--ok); font-size: 14px; margin: 2px 0 4px; }

  details { border-top: 1px solid var(--line); padding: 6px 12px; font-size: 13px; color: var(--dim); }
  details pre { white-space: pre-wrap; margin: 4px 0; color: var(--text); font: 13px/1.4 "Segoe UI", sans-serif; }
  #err { color: var(--err); font-size: 12px; padding: 0 12px; min-height: 0; }

  #presets { display: flex; gap: 6px; padding: 8px 12px 0; background: var(--panel); border-top: 1px solid var(--line);
    flex-wrap: wrap; }
  #presets button { flex: 1; min-width: 110px; background: var(--bg); color: var(--text); border: 1px solid #4b3a73;
    border-radius: 4px; padding: 7px 8px; font: 600 14px "Segoe UI", sans-serif; cursor: pointer; text-align: left; }
  #presets button:hover { border-color: #b48cff; }
  #presets button:disabled { opacity: .45; cursor: progress; }
  #presets kbd { display: block; font: 10px "Segoe UI", sans-serif; color: var(--dim); }
  form { display: flex; gap: 6px; padding: 8px 12px; background: var(--panel); }
  input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px;
    padding: 8px 10px; font: inherit; }
  input:focus { outline: none; border-color: #b48cff; }
  form button { background: #b48cff; color: #000; border: 0; border-radius: 4px; padding: 0 14px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <select id="provider" title="KI-Anbieter (Fallback immer: Ollama lokal)"></select>
  <span id="engine" class="badge" title="Hat zuletzt geantwortet">-</span>
  <span id="lat"></span>
  <span id="cnote" style="color:var(--warn)"></span>
  <span id="stt" class="badge off">STT lädt</span>
  <span class="meter" title="Du (Mikrofon)">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--user)" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span class="bar"><i id="lv-User" style="background:var(--user)"></i></span>
  </span>
  <span class="meter" title="Teilnehmer (Loopback)">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--part)" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>
    <span class="bar"><i id="lv-Participant" style="background:var(--part)"></i></span>
  </span>
  <span class="spacer"></span>
  <button id="tg-proactive" class="tog" title="Strg+Alt+P">Proaktiv</button>
  <button id="tg-translate" class="tog" title="Strg+Alt+T">Übersetzen</button>
  <span id="win">
    <button id="pin" class="tog icon" title="Immer im Vordergrund (Strg+Alt+O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 15v6"/></svg>
    </button>
    <input id="opacity" type="range" min="40" max="100" step="5" title="Deckkraft">
  </span>
  <button id="open-meetings" class="tog icon" title="Gespeicherte Meetings öffnen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
  </button>
  <button id="open-notes" class="tog icon" title="Wissensbasis öffnen (Änderungen gelten sofort)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button id="open-settings" class="tog icon" title="Einstellungen (.env) öffnen (gelten nach Neustart)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</header>

<div id="bar">
  <button id="meeting">Meeting starten</button>
  <button id="mic" class="tog" title="Mikrofon an/aus (Strg+Alt+M). Die Teilnehmer werden weiter gehört.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span>Mikro an</span>
  </button>
</div>
<div id="notice"></div>

<button id="pending" title="Sofort anzeigen"></button>
<div id="cards"></div>
<div id="err"></div>
<div id="transcript"></div>
<details><summary>Fakten</summary><pre id="facts">(noch keine)</pre></details>
<details><summary>Gedächtnis (alle 5 min)</summary><pre id="memory">(noch keine)</pre></details>
<div id="presets"></div>
<form id="ask">
  <input id="q" placeholder="Frage stellen (Strg+Alt+Leertaste) …" autocomplete="off">
  <button>Fragen</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MAX_CARDS = 6;
let ws, mode = { proactive: true, translate: false }, lastTurn = null;
let meeting = { active: false, mic: true, error: "" }, kb = null, ollamaNote = "", saved = "";
let win = { on_top: true, opacity: 1 };
const MIC_ICONS = { on: '<path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', off: '<path d="M15 9.3V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 5.1 2.1"/><path d="M5 11a7 7 0 0 0 11.4 5.4M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"/>' };
// Reading time: a new proactive card waits until the current one has been shown for readMs,
// you have stopped talking, and nothing is pinned. Only the newest waiting card is kept.
let readMs = 10000, holdUntil = 0, userSpokeAt = 0, pinned = null, pending = null;
const names = {};  // provider id -> label, filled by the "providers" event
const engineName = (id) => names[id] || id;

function card(ev, isAnswer) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "card" + (isAnswer ? " answer" : "");
  el.title = "Klicken zum Anheften";
  el.onclick = () => pin(el);
  const label = isAnswer ? `Frage: <b>${esc(ev.query)}</b>` : `<b>${esc(ev.trigger)}</b>`;
  el.innerHTML = `<div class="meta">${label}<span>${esc(engineName(ev.engine))} ${ev.ms} ms</span></div>` +
    (ev.suggestions || []).map((s) => {
      const tone = String(s.tone || "").toLowerCase().replace(/\s+/g, "-");
      return `<div class="sugg t-${esc(tone)}"><small>${esc(s.intent)} · ${esc(s.tone)}</small>${esc(s.text)}</div>`;
    }).join("");
  const cards = $("cards");
  cards.prepend(el);
  [...cards.children].forEach((c, i) => c.classList.toggle("old", i > 0));
  while (cards.children.length > MAX_CARDS) {
    if (cards.lastChild === pinned) pinned = null;
    cards.lastChild.remove();
  }
  cards.scrollTop = 0;
  if (!ev.replay) holdUntil = Date.now() + readMs;
}

const canReplace = () => !pinned && Date.now() >= holdUntil && Date.now() - userSpokeAt > 1500;

function suggestion(ev) {
  if (ev.replay || canReplace()) { card(ev, false); return; }
  pending = ev;
  renderPending();
}

function showPending() {
  if (!pending) return;
  const ev = pending;
  pending = null;
  card(ev, false);
  renderPending();
}

function renderPending() {
  const b = $("pending");
  b.style.display = pending ? "block" : "none";
  if (pending) b.textContent = `Neuer Vorschlag wartet: ${pending.trigger} · anzeigen`;
}

function pin(el) {
  pinned?.classList.remove("pinned");
  pinned = pinned === el ? null : el;
  pinned?.classList.add("pinned");
  if (!pinned) holdUntil = 0;  // unpinned: a waiting card may come now
}

setInterval(() => { if (pending && canReplace()) showPending(); }, 500);

function segment(ev) {
  const box = $("transcript");
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (ev.new_turn || !lastTurn || lastTurn.dataset.source !== ev.source) {
    lastTurn = document.createElement("div");
    lastTurn.className = "turn " + ev.source;
    lastTurn.dataset.source = ev.source;
    lastTurn.innerHTML = `<div class="who">${ev.source === "User" ? "Du" : "Teilnehmer"}</div>`;
    box.append(lastTurn);
  }
  const s = document.createElement("span");
  s.className = "seg";
  s.id = "s" + ev.id;
  s.textContent = ev.text + " ";
  lastTurn.append(s);
  while (box.children.length > 200) box.firstChild.remove();
  if (stick) box.scrollTop = box.scrollHeight;
}

function translation(ev) {
  const seg = $("s" + ev.id);
  if (!seg) return;
  const t = document.createElement("span");
  t.className = "tr";
  t.textContent = `${ev.target}: ${ev.text}`;
  seg.after(t);
  const box = $("transcript");
  box.scrollTop = box.scrollHeight;
}

function clearScreen() {
  saved = "";
  pending = pinned = null;
  holdUntil = 0;
  renderPending();
  $("transcript").innerHTML = "";
  $("cards").innerHTML = `<div id="empty"></div>`;
  lastTurn = null;
  renderMeeting();
}

function renderMeeting() {
  const btn = $("meeting");
  btn.textContent = meeting.active ? "Meeting beenden" : "Meeting starten";
  btn.classList.toggle("live", meeting.active);
  const mic = $("mic");
  mic.classList.toggle("muted", !meeting.mic);
  mic.querySelector("svg").innerHTML = MIC_ICONS[meeting.mic ? "on" : "off"];
  mic.querySelector("span").textContent = meeting.mic ? "Mikro an" : "Mikro aus";
  const empty = $("empty");
  if (empty) empty.textContent = meeting.active ? "Warte auf den Gesprächspartner …"
    : "Klicke auf „Meeting starten“, sobald dein Gespräch beginnt.";
  renderNotice();
}

function renderNotice() {
  const items = [];
  if (meeting.error) items.push(`<div class="n err">Audio: ${esc(meeting.error)}</div>`);
  if (saved) items.push(`<div class="n info">Meeting gespeichert: ${esc(saved.split(/[\\/]/).pop())}
    <button class="link" data-open="meetings">Ordner öffnen</button></div>`);
  if (ollamaNote) items.push(`<div class="n warn">${esc(ollamaNote)}</div>`);
  if (kb && kb.files === 0) items.push(`<div class="n info">Deine Wissensbasis ist noch leer. Lege Markdown-Dateien
    (.md) in den Ordner, z. B. Produkte, Preise, FAQ oder deinen Lebenslauf. Sie werden sofort durchsucht.
    <button class="link" data-open="notes">Ordner öffnen</button></div>`);
  $("notice").innerHTML = items.join("");
}

function setMode(m) {
  mode = m;
  $("tg-proactive").classList.toggle("on", m.proactive);
  $("tg-translate").classList.toggle("on", m.translate);
}

function presets(ev) {
  const box = $("presets");
  box.innerHTML = "";
  for (const p of ev.presets) {
    const b = document.createElement("button");
    b.type = "button";
    b.title = p.query;
    b.innerHTML = `${esc(p.label)}<kbd>${esc(p.hotkey.replace("ctrl", "Strg").replace(/\+(\w)/g, (m, c) => "+" + c.toUpperCase()))}</kbd>`;
    b.onclick = () => ask(p.query);
    box.append(b);
  }
}

// Preset buttons are disabled while a question is running (answer or error re-enables them).
const busy = (on) => document.querySelectorAll("#presets button").forEach((b) => { b.disabled = on; });

function providers(ev) {
  const sel = $("provider");
  sel.innerHTML = "";
  let active = ev.active;
  for (const p of ev.list) {
    names[p.id] = p.label;
    // Every installed Ollama model is its own entry ("ollama:<model>").
    const models = p.id === "ollama" && ev.ollama_models.length ? ev.ollama_models : [null];
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m ? `ollama:${m}` : p.id;
      o.disabled = !p.configured;
      o.textContent = p.configured ? `${p.label} · ${m || p.model}` : `${p.label} (kein Key)`;
      sel.append(o);
      if (m && m === p.model && active === "ollama") active = o.value;
    }
  }
  sel.value = active;
  ollamaNote = ev.ollama_note;
  renderNotice();
}

const handlers = {
  providers,
  presets,
  segment,
  translation,
  retract: (ev) => { const s = $("s" + ev.id); const turn = s?.parentElement; s?.remove();
    if (turn && !turn.querySelector(".seg")) turn.remove(); },
  suggestion,
  ui: (ev) => { readMs = ev.read_s * 1000; document.body.classList.toggle("single", ev.single); },
  answer: (ev) => { busy(false); card(ev, true); },
  asking: (ev) => { busy(true); $("err").textContent = `Frage läuft: ${ev.query}`; },
  mode: setMode,
  meeting: (ev) => { meeting = ev; renderMeeting(); },
  reset: clearScreen,
  saved: (ev) => { saved = ev.path; renderNotice(); },
  window: (ev) => { win = ev; $("win").style.display = ev.supported ? "flex" : "none";
    $("pin").classList.toggle("on", ev.on_top); $("opacity").value = Math.round(ev.opacity * 100); },
  kb: (ev) => { kb = ev; renderNotice(); },
  facts: (ev) => { $("facts").textContent = ev.text; },
  memory: (ev) => { $("memory").textContent = ev.text; },
  engine: (ev) => { const e = $("engine"); e.textContent = engineName(ev.engine);
    e.className = "badge " + (ev.engine === "ollama" ? "ollama" : "cloud");
    $("lat").textContent = ev.ms + " ms"; $("err").textContent = ""; },
  stt: (ev) => { const e = $("stt"); e.textContent = ev.ready ? "STT bereit" : "STT lädt";
    e.className = "badge" + (ev.ready ? "" : " off"); },
  levels: (ev) => { for (const k of ["User", "Participant"])
    $("lv-" + k).style.width = Math.min(100, Math.sqrt(ev[k]) * 300) + "%";
    $("cnote").textContent = ev.cloud_note || "";
    if (ev.user_speaking) userSpokeAt = Date.now(); },
  focus_query: () => { $("q").focus(); $("q").select(); },
  error: (ev) => { busy(false); $("err").textContent = ev.text; },
};

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (m) => { const ev = JSON.parse(m.data); handlers[ev.type]?.(ev); };
  ws.onclose = () => { $("stt").textContent = "getrennt"; $("stt").className = "badge off"; setTimeout(connect, 1000); };
  ws.onopen = clearScreen;
}

const send = (obj) => ws?.readyState === 1 && ws.send(JSON.stringify(obj));
const ask = (query) => send({ type: "ask", query });
$("ask").onsubmit = (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); $("q").value = ""; };
$("provider").onchange = (e) => send({ type: "provider", id: e.target.value });
$("tg-proactive").onclick = () => send({ type: "mode", proactive: !mode.proactive });
$("tg-translate").onclick = () => send({ type: "mode", translate: !mode.translate });
$("open-notes").onclick = () => send({ type: "open", what: "notes" });
$("pending").onclick = () => { pin(pinned); showPending(); };
$("open-meetings").onclick = () => send({ type: "open", what: "meetings" });
$("pin").onclick = () => send({ type: "window", on_top: !win.on_top });
$("opacity").onchange = (e) => send({ type: "window", opacity: e.target.value / 100 });
$("notice").onclick = (e) => { const w = e.target.dataset.open; if (w) send({ type: "open", what: w }); };
$("meeting").onclick = () => send({ type: "meeting", active: !meeting.active });
$("mic").onclick = () => send({ type: "mic", on: !meeting.mic });
$("open-settings").onclick = () => send({ type: "open", what: "settings" });
clearScreen();
connect();
</script>
</body>
</html>
