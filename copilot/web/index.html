<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Copilot</title>
<style>
  :root {
    --bg: #07090c; --panel: #10141a; --line: #1f2630; --text: #f4f6f8; --dim: #8a94a3;
    --user: #7cc4ff; --part: #ffd166; --ok: #3ddc97; --warn: #ffb020; --err: #ff5d5d;
    --confident: #4fd1ff; --consultative: #3ddc97; --deesc: #ffb020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel); font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .badge { padding: 2px 8px; border-radius: 4px; background: var(--line); color: var(--text); font-weight: 600; }
  .badge.gemini { background: #0f3d57; color: var(--confident); }
  .badge.ollama { background: #4a3500; color: var(--warn); }
  .badge.off { background: #3a1212; color: var(--err); }
  .meter { display: flex; align-items: center; gap: 4px; }
  .meter svg { width: 14px; height: 14px; }
  .bar { width: 36px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .15s; }
  .spacer { flex: 1; }
  button.tog { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 4px;
    padding: 3px 8px; font: inherit; cursor: pointer; }
  button.tog.on { border-color: var(--ok); color: var(--ok); }

  #cards { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 55vh; overflow-y: auto; }
  .card { border-left: 4px solid var(--confident); background: var(--panel); border-radius: 6px; padding: 10px 12px;
    transition: opacity .4s; }
  .card.old { opacity: .38; }
  .card.old .sugg { font-size: 16px; }
  .card .meta { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
    display: flex; gap: 8px; margin-bottom: 4px; }
  .card .meta b { color: var(--text); }
  .card.answer { border-left-color: #b48cff; }
  .sugg { font-size: 23px; font-weight: 700; line-height: 1.3; margin: 4px 0; }
  .sugg + .sugg { margin-top: 10px; }
  .sugg small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .t-confident small { color: var(--confident); }
  .t-consultative small { color: var(--consultative); }
  .t-de-escalating small { color: var(--deesc); }
  #empty { color: var(--dim); font-size: 14px; padding: 8px 0; }

  #transcript { flex: 1; overflow-y: auto; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .turn { margin: 6px 0; }
  .turn .who { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .turn.User .who { color: var(--user); }
  .turn.Participant .who { color: var(--part); }
  .seg { color: #d6dbe1; }
  .tr { display: block; color: var(--ok); font-size: 14px; margin: 2px 0 4px; }

  details { border-top: 1px solid var(--line); padding: 6px 12px; font-size: 13px; color: var(--dim); }
  details pre { white-space: pre-wrap; margin: 4px 0; color: var(--text); font: 13px/1.4 "Segoe UI", sans-serif; }
  #err { color: var(--err); font-size: 12px; padding: 0 12px; min-height: 0; }

  #presets { display: flex; gap: 6px; padding: 8px 12px 0; background: var(--panel); border-top: 1px solid var(--line);
    flex-wrap: wrap; }
  #presets button { flex: 1; min-width: 110px; background: var(--bg); color: var(--text); border: 1px solid #4b3a73;
    border-radius: 4px; padding: 7px 8px; font: 600 14px "Segoe UI", sans-serif; cursor: pointer; text-align: left; }
  #presets button:hover { border-color: #b48cff; }
  #presets button:disabled { opacity: .45; cursor: progress; }
  #presets kbd { display: block; font: 10px "Segoe UI", sans-serif; color: var(--dim); }
  form { display: flex; gap: 6px; padding: 8px 12px; background: var(--panel); }
  input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 4px;
    padding: 8px 10px; font: inherit; }
  input:focus { outline: none; border-color: #b48cff; }
  form button { background: #b48cff; color: #000; border: 0; border-radius: 4px; padding: 0 14px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <span id="engine" class="badge">-</span>
  <span id="lat"></span>
  <span id="gnote" style="color:var(--warn)"></span>
  <span id="stt" class="badge off">STT lädt</span>
  <span class="meter" title="Du (Mikrofon)">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--user)" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span class="bar"><i id="lv-User" style="background:var(--user)"></i></span>
  </span>
  <span class="meter" title="Teilnehmer (Loopback)">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--part)" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>
    <span class="bar"><i id="lv-Participant" style="background:var(--part)"></i></span>
  </span>
  <span class="spacer"></span>
  <button id="tg-proactive" class="tog" title="Strg+Alt+P">Proaktiv</button>
  <button id="tg-translate" class="tog" title="Strg+Alt+T">Übersetzen</button>
</header>

<div id="cards"><div id="empty">Warte auf den Gesprächspartner …</div></div>
<div id="err"></div>
<div id="transcript"></div>
<details><summary>Fakten</summary><pre id="facts">(noch keine)</pre></details>
<details><summary>Gedächtnis (alle 5 min)</summary><pre id="memory">(noch keine)</pre></details>
<div id="presets"></div>
<form id="ask">
  <input id="q" placeholder="Frage stellen (Strg+Alt+Leertaste) …" autocomplete="off">
  <button>Fragen</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MAX_CARDS = 6;
let ws, mode = { proactive: true, translate: false }, lastTurn = null;

function card(ev, isAnswer) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "card" + (isAnswer ? " answer" : "");
  const label = isAnswer ? `Frage: <b>${esc(ev.query)}</b>` : `<b>${esc(ev.trigger)}</b>`;
  el.innerHTML = `<div class="meta">${label}<span>${esc(ev.engine)} ${ev.ms} ms</span></div>` +
    (ev.suggestions || []).map((s) => {
      const tone = String(s.tone || "").toLowerCase().replace(/\s+/g, "-");
      return `<div class="sugg t-${esc(tone)}"><small>${esc(s.intent)} · ${esc(s.tone)}</small>${esc(s.text)}</div>`;
    }).join("");
  const cards = $("cards");
  cards.prepend(el);
  [...cards.children].forEach((c, i) => c.classList.toggle("old", i > 0));
  while (cards.children.length > MAX_CARDS) cards.lastChild.remove();
  cards.scrollTop = 0;
}

function segment(ev) {
  const box = $("transcript");
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (ev.new_turn || !lastTurn || lastTurn.dataset.source !== ev.source) {
    lastTurn = document.createElement("div");
    lastTurn.className = "turn " + ev.source;
    lastTurn.dataset.source = ev.source;
    lastTurn.innerHTML = `<div class="who">${ev.source === "User" ? "Du" : "Teilnehmer"}</div>`;
    box.append(lastTurn);
  }
  const s = document.createElement("span");
  s.className = "seg";
  s.id = "s" + ev.id;
  s.textContent = ev.text + " ";
  lastTurn.append(s);
  while (box.children.length > 200) box.firstChild.remove();
  if (stick) box.scrollTop = box.scrollHeight;
}

function translation(ev) {
  const seg = $("s" + ev.id);
  if (!seg) return;
  const t = document.createElement("span");
  t.className = "tr";
  t.textContent = `${ev.target}: ${ev.text}`;
  seg.after(t);
  const box = $("transcript");
  box.scrollTop = box.scrollHeight;
}

function setMode(m) {
  mode = m;
  $("tg-proactive").classList.toggle("on", m.proactive);
  $("tg-translate").classList.toggle("on", m.translate);
}

function presets(ev) {
  const box = $("presets");
  box.innerHTML = "";
  for (const p of ev.presets) {
    const b = document.createElement("button");
    b.type = "button";
    b.title = p.query;
    b.innerHTML = `${esc(p.label)}<kbd>${esc(p.hotkey.replace("ctrl", "Strg").replace(/\+(\w)/g, (m, c) => "+" + c.toUpperCase()))}</kbd>`;
    b.onclick = () => ask(p.query);
    box.append(b);
  }
}

// Preset buttons are disabled while a question is running (answer or error re-enables them).
const busy = (on) => document.querySelectorAll("#presets button").forEach((b) => { b.disabled = on; });

const handlers = {
  presets,
  segment,
  translation,
  retract: (ev) => { const s = $("s" + ev.id); const turn = s?.parentElement; s?.remove();
    if (turn && !turn.querySelector(".seg")) turn.remove(); },
  suggestion: (ev) => card(ev, false),
  answer: (ev) => { busy(false); card(ev, true); },
  asking: (ev) => { busy(true); $("err").textContent = `Frage läuft: ${ev.query}`; },
  mode: setMode,
  facts: (ev) => { $("facts").textContent = ev.text; },
  memory: (ev) => { $("memory").textContent = ev.text; },
  engine: (ev) => { const e = $("engine"); e.textContent = ev.engine === "gemini" ? "Gemini" : "Ollama";
    e.className = "badge " + ev.engine; $("lat").textContent = ev.ms + " ms"; $("err").textContent = ""; },
  stt: (ev) => { const e = $("stt"); e.textContent = ev.ready ? "STT bereit" : "STT lädt";
    e.className = "badge" + (ev.ready ? "" : " off"); },
  levels: (ev) => { for (const k of ["User", "Participant"])
    $("lv-" + k).style.width = Math.min(100, Math.sqrt(ev[k]) * 300) + "%";
    $("gnote").textContent = ev.gemini_note || ""; },
  focus_query: () => { $("q").focus(); $("q").select(); },
  error: (ev) => { busy(false); $("err").textContent = ev.text; },
};

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (m) => { const ev = JSON.parse(m.data); handlers[ev.type]?.(ev); };
  ws.onclose = () => { $("stt").textContent = "getrennt"; $("stt").className = "badge off"; setTimeout(connect, 1000); };
  ws.onopen = () => { $("transcript").innerHTML = ""; $("cards").innerHTML = ""; lastTurn = null; };
}

const send = (obj) => ws?.readyState === 1 && ws.send(JSON.stringify(obj));
const ask = (query) => send({ type: "ask", query });
$("ask").onsubmit = (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); $("q").value = ""; };
$("tg-proactive").onclick = () => send({ type: "mode", proactive: !mode.proactive });
$("tg-translate").onclick = () => send({ type: "mode", translate: !mode.translate });
connect();
</script>
</body>
</html>
