[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Real-time local meeting copilot for Windows, Linux and macOS: mic + system audio capture, faster-whisper, cloud/Ollama suggestions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    "soxr>=0.5",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "google-genai>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "pynput>=1.7; sys_platform != 'win32'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "lancedb>=0.13",
    "pyarrow>=16",
    "fastembed>=0.4",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "watchfiles>=0.22",
    "anthropic>=2.2.0",
    "openai>=3.37.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
